# Cloudflare Workers configuration for 于典的个人网站
# 文档：https://developers.cloudflare.com/workers/wrangler/configuration/

# 必须与 Cloudflare 上的 Worker / Workers Builds 项目名一致，
# 否则 CI 会用项目名覆盖这里并给出警告。
name = "test"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# 静态资源直接由 Cloudflare 边缘分发（public/ 目录）
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

# SQLite 数据库（已在 Cloudflare 账号中创建）。
[[d1_databases]]
binding = "DB"
database_name = "yudian-portfolio"
database_id = "58ef55ba-dbca-442b-af01-b2fc3c1ca9a5"

# 图片不占用对象存储：后台上传已移除，头像 / 封面请填写图片地址，
# 例如 /assets/covers/orbit.svg 或任意外链。放在 public/ 下的图片由静态资源免费分发。

[vars]
ADMIN_USERNAME = "admin"

# 生产环境的密码请用 secret 设置，不要写在这里：
#   npx wrangler secret put ADMIN_PASSWORD
# 本地开发放在 .dev.vars 里（参见 .dev.vars.example）。
