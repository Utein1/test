<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c1a"/>
      <stop offset="0.5" stop-color="#0b1226"/>
      <stop offset="1" stop-color="#100b22"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".5"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.45" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset=".5" stop-color="#67e8f9" stop-opacity=".65"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="blurSm"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="860" cy="330" r="360" fill="url(#glowB)" filter="url(#blur)"/>
  <circle cx="250" cy="560" r="300" fill="url(#glowA)" filter="url(#blur)"/>

  <g fill="#e0f2fe">
    <circle cx="120" cy="110" r="1.8" opacity=".8"/>
    <circle cx="300" cy="70" r="1.2" opacity=".5"/>
    <circle cx="520" cy="150" r="1.6" opacity=".65"/>
    <circle cx="1000" cy="90" r="1.4" opacity=".6"/>
    <circle cx="1100" cy="240" r="2" opacity=".7"/>
    <circle cx="760" cy="80" r="1" opacity=".5"/>
    <circle cx="200" cy="300" r="1" opacity=".4"/>
    <circle cx="420" cy="560" r="1.4" opacity=".5"/>
    <circle cx="660" cy="620" r="1.2" opacity=".4"/>
    <circle cx="1060" cy="540" r="1.6" opacity=".55"/>
    <circle cx="920" cy="640" r="1" opacity=".35"/>
    <circle cx="80" cy="480" r="1.2" opacity=".4"/>
    <circle cx="240" cy="200" r=".9" opacity=".35"/>
    <circle cx="580" cy="440" r="1" opacity=".3"/>
  </g>

  <g transform="translate(830 360)">
    <ellipse rx="330" ry="92" fill="none" stroke="url(#orbit)" stroke-width="1.6" transform="rotate(-18)"/>
    <ellipse rx="270" ry="70" fill="none" stroke="#a5f3fc" stroke-opacity=".14" stroke-width="1" transform="rotate(-18)"/>
    <circle r="168" fill="#1d4ed8" opacity=".45" filter="url(#blur)"/>
    <circle r="146" fill="url(#planet)"/>
    <path d="M0-146a146 146 0 0 1 0 292 158 158 0 0 0 0-292Z" fill="#05070e" opacity=".3"/>
    <ellipse cx="-38" cy="-52" rx="70" ry="36" fill="#fff" opacity=".12" filter="url(#blurSm)"/>
    <ellipse rx="290" ry="76" fill="none" stroke="#e0f2fe" stroke-opacity=".3" stroke-width="2" transform="rotate(-18)"/>
    <circle cx="244" cy="-186" r="10" fill="#fde68a"/>
    <circle cx="244" cy="-186" r="20" fill="#fde68a" opacity=".16" filter="url(#blurSm)"/>
  </g>

  <g transform="translate(210 200)">
    <path d="M0 0c60-38 130-46 190-22" fill="none" stroke="#67e8f9" stroke-opacity=".25" stroke-width="1"/>
    <path d="M-20 60c70-20 160-12 220 26" fill="none" stroke="#a78bfa" stroke-opacity=".2" stroke-width="1"/>
    <circle cx="0" cy="0" r="4" fill="#67e8f9"/>
    <circle cx="190" cy="-22" r="2.5" fill="#a5f3fc"/>
    <circle cx="-20" cy="60" r="2" fill="#c4b5fd"/>
  </g>

  <rect x="70" y="70" width="1060" height="560" rx="28" fill="none" stroke="#94a3b8" stroke-opacity=".07"/>
</svg>
