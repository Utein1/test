<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="28%" cy="18%" r="95%">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset="0.55" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#05070e"/>
    </radialGradient>
    <linearGradient id="planet" x1="0.1" y1="0" x2="0.9" y2="1">
